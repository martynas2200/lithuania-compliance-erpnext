<div class="lt-bank-import">
	<p class="text-muted lt-bank-import-intro">
		{{ __("Upload an ISO_XML_052 (ISO 20022 CAMT052) bank statement file to create Bank Transactions and possibly Payment Entries.") }}
	</p>
	<div class="form-horizontal">
		<div class="form-group">
			<label class="control-label col-sm-2">{{ __("File") }}</label>
			<div class="col-sm-6">
				<input type="file" id="lt_bank_file" class="form-control" />
			</div>
		</div>
		<div class="form-group">
			<label class="control-label col-sm-2">{{ __("Description") }}</label>
			<div class="col-sm-6">
				<input type="text" id="lt_bank_description" class="form-control" placeholder="{{ __("Optional note about this import") }}" />
			</div>
		</div>
		<div class="form-group">
			<div class="col-sm-2"></div>
			<div class="col-sm-6">
				<div class="checkbox">
					<label>
						<input type="checkbox" id="lt_bank_auto_submit" checked>
						{{ __("Submit created Payment Entries") }}
					</label>
					<p class="help-block text-muted">
						{{ __("If not checked, created Payment Entries will remain in Draft state.") }}
					</p>
				</div>
			</div>
		</div>
		<div class="form-group lt-bank-import-actions">
			<div class="col-sm-2"></div>
			<div class="col-sm-6">
				<button type="button" id="lt_bank_submit" class="btn btn-primary">
					{{ __("Import Bank Statement") }}
				</button>
			</div>
		</div>
	</div>
	<div id="lt_bank_feedback" class="lt-bank-import-feedback"></div>
	<div id="lt_bank_log" class="lt-bank-import-log"></div>
</div>
